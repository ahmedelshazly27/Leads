[project]
name = "travel-film-director"
version = "0.1.0"
description = "Local (macOS-first) AI travel film director: reference-style intelligence from YouTube + autonomous editing of your own footage."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "yt-dlp[default]>=2026.11.23",
  "youtube-transcript-api>=1.2",
  "scenedetect[opencv-headless]>=0.6.7",
  "opencv-python-headless>=4.10,<5",  # 5.x dropped Haar cascades
  "numpy>=1.26",
  "pillow>=10.4",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "opentimelineio>=0.17",
  "otio-fcp-adapter>=1.0",        # FCP7 XML (Premiere / Resolve fallback)
  "otio-fcpx-xml-adapter>=1.0",   # FCPXML for Final Cut Pro
]

[project.optional-dependencies]
claude = ["anthropic>=0.75"]
transcribe = [
  "faster-whisper>=1.1",
  # Apple Silicon: Whisper on the GPU via MLX (used automatically when installed)
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
tfd = "tfd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to YouTube"]
